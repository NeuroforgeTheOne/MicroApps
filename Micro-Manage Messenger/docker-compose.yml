version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messengerpass
      POSTGRES_DB: messengerdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
